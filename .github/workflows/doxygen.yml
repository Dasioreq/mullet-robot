name: Deploy Doxygen
on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Install Latest Doxygen
        run: |
          wget https://doxygen.nl
          tar -xzf doxygen-1.13.2.linux.bin.tar.gz
          echo "$(pwd)/doxygen-1.13.2/bin" >> $GITHUB_PATH

      - name: Generate Documentation
        run: doxygen Doxyfile

      - name: Create .nojekyll
        run: touch html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: html
          branch: gh-pages
          